<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inoreader → Obsidian</title><link rel="stylesheet" href="style.css">
<main><header><span>INOREADER → OBSIDIAN</span><h1>読む。要約する。残す。</h1><p>記事の要点を、あなたのVaultへ。</p></header>
<section><h2>1. Inoreaderで要約を作成</h2><p>Inoreaderの有料プランの要約機能で要約を生成し、記事と要約を表示した状態で拡張を開いてください。</p><p class="hint">自動取得できない場合は、Inoreaderの要約テキストを選択して「再取得」を押すか、要約欄にコピーして貼り付けてください。APIキーは不要です。</p></section>
<section><h2>2. 記事を確認</h2><button id="extract">Inoreaderから再取得</button><label>タイトル<input id="title"></label><div class="row"><label>記事の作成日<input id="date" type="date"></label><label>記事のリンク<input id="url" type="url"></label></div></section>
<section><h2>3. 編集して保存</h2><label>要約（Markdown）<textarea id="summary" rows="10" placeholder="Inoreaderで生成した要約を貼り付けることもできます"></textarea></label><label>Vault内の保存先フォルダ<input id="folder" placeholder="例: Clippings/Inoreader"></label><div class="actions"><button id="choose">Vaultフォルダを選択</button><button id="save" class="primary">Vaultへ保存</button></div><p id="vault" class="hint">Vault未選択</p><button id="settings">保存先の設定を保存</button><details><summary>保存するMarkdownをプレビュー</summary><pre id="preview"></pre></details></section><p id="status" role="status" aria-live="polite"></p></main><script type="module" src="app.js"></script></html>
